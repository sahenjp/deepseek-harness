# oh-my-dsh Web profile layer. It keeps the upstream Web application and adds
# one opinionated coding preset with role-routed subagents.
- id: agent-default-model
  config:
    provider: !!js "process.env.OMDSH_MAIN_PROVIDER ?? 'deepseek-official'"
    model: !!js "process.env.OMDSH_MAIN_MODEL ?? 'deepseek-flash'"
    reasoningEffort: !!js "process.env.OMDSH_MAIN_EFFORT || undefined"

- id: agent-preset-registry
  config:
    default: oh-my-dsh

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

- id: time-context
  disabled: false

- id: schedule
  disabled: false

- id: ui-schedule
  disabled: false

- insert:
    - id: preset-oh-my-dsh
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: oh-my-dsh
        name: Oh My DSH
        description: PTC coding preset with role-routed specialists and continuable subagents.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are Oh My DSH, a terminal-first coding agent. Work directly from repository evidence,
                keep changes focused, and delegate aggressively when parallel exploration, implementation,
                architecture, or review would reduce the main context. Use scout for fast independent research,
                worker for implementation, reviewer for context-aware review, and architect for design decisions.
                Keep the main thread responsible for integration and the final answer.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Explore with read-only tools, resolve repository facts yourself, and do not modify files or configuration. Delegate independent research to scout or architect when it makes the plan more complete without bloating the main context. When the plan is decision-complete, call exit_plan_mode as the final tool call.

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
                  maxDepth: 2

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
                  maxDepth: 2

              - id: omdsh-scout
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: scout
                  backgroundMode: continuable
                  maxDepth: 2
                  persona: >-
                    You are the Oh My DSH scout. Inspect quickly and independently. Prefer search, reads,
                    diagnostics, and small experiments. Return concrete paths, symbols, commands, risks, and
                    concise evidence to the parent. Do not expand scope or make unrelated edits.
                  agentOptions: !!js "process.env.OMDSH_SCOUT_MODEL ? ({ provider: process.env.OMDSH_SCOUT_PROVIDER ?? (process.env.OMDSH_MAIN_PROVIDER ?? 'deepseek-official'), model: process.env.OMDSH_SCOUT_MODEL, reasoningEffort: process.env.OMDSH_SCOUT_EFFORT || undefined }) : undefined"

              - id: omdsh-worker
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: worker
                  backgroundMode: continuable
                  maxDepth: 2
                  persona: >-
                    You are the Oh My DSH worker. Own one bounded implementation task end to end. Inspect the
                    relevant code first, make the smallest coherent change, run focused checks, and report exact
                    files changed, validation performed, and unresolved risks.
                  agentOptions: !!js "process.env.OMDSH_WORKER_MODEL ? ({ provider: process.env.OMDSH_WORKER_PROVIDER ?? (process.env.OMDSH_MAIN_PROVIDER ?? 'deepseek-official'), model: process.env.OMDSH_WORKER_MODEL, reasoningEffort: process.env.OMDSH_WORKER_EFFORT || undefined }) : undefined"

              - id: omdsh-reviewer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: reviewer
                  backgroundMode: continuable
                  maxDepth: 1
                  persona: >-
                    You are the Oh My DSH reviewer. Review the inherited conversation and repository state for
                    correctness, regressions, security, missing tests, and unnecessary complexity. Lead with
                    actionable findings and cite exact files or behaviors. Do not rewrite code unless asked.
                  agentOptions: !!js "process.env.OMDSH_REVIEWER_MODEL ? ({ provider: process.env.OMDSH_REVIEWER_PROVIDER ?? (process.env.OMDSH_MAIN_PROVIDER ?? 'deepseek-official'), model: process.env.OMDSH_REVIEWER_MODEL, reasoningEffort: process.env.OMDSH_REVIEWER_EFFORT || undefined }) : undefined"

              - id: omdsh-architect
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: architect
                  backgroundMode: continuable
                  maxDepth: 2
                  persona: >-
                    You are the Oh My DSH architect. Use the inherited context to resolve design questions,
                    interfaces, migration paths, tradeoffs, and failure modes. Prefer existing extension seams and
                    return a decision-ready design that another worker can implement without inventing policy.
                  agentOptions: !!js "process.env.OMDSH_ARCHITECT_MODEL ? ({ provider: process.env.OMDSH_ARCHITECT_PROVIDER ?? (process.env.OMDSH_MAIN_PROVIDER ?? 'deepseek-official'), model: process.env.OMDSH_ARCHITECT_MODEL, reasoningEffort: process.env.OMDSH_ARCHITECT_EFFORT || undefined }) : undefined"

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
