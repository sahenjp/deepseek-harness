# oh-my-dsh Web profile overlay.
# Keeps upstream Web/session services and adds an opinionated terminal-first preset.

- id: agent-default-model
  config:
    provider: !!js process.env.OMDSH_MAIN_PROVIDER ?? 'deepseek-official'
    model: !!js process.env.OMDSH_MAIN_MODEL ?? 'deepseek-flash'
    reasoningEffort: !!js process.env.OMDSH_MAIN_EFFORT

- id: agent-preset-registry
  config:
    default: oh-my-dsh

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

- id: time-context
  disabled: false

- id: schedule
  disabled: false

- id: ui-schedule
  disabled: false

- insert:
    - id: preset-oh-my-dsh
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: oh-my-dsh
        name: oh-my-dsh
        description: PTC coding preset with role-based continuable subagents and fork review.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are oh-my-dsh, a coding agent optimized for fast terminal-driven work.
                Delegate independent research and implementation early. Use scout for exploration,
                worker for implementation, reviewer for adversarial review, architect for design,
                and subagent_fork when a child must inherit this conversation.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Explore with non-mutating tools first. Do not edit files or run mutation commands.
                    Produce a decision-complete plan and submit it through exit_plan_mode before implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable
                  maxDepth: 2
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
                  maxDepth: 2
              - id: oh-my-scout
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: scout
                  backgroundMode: continuable
                  maxDepth: 2
                  persona: >-
                    You are Scout. Explore quickly and read broadly. Do not edit files.
                    Return concrete paths, symbols, commands, risks, and a concise recommendation.
                  agentOptions: !!js "process.env.OMDSH_SCOUT_PROVIDER && process.env.OMDSH_SCOUT_MODEL ? { provider: process.env.OMDSH_SCOUT_PROVIDER, model: process.env.OMDSH_SCOUT_MODEL, ...(process.env.OMDSH_SCOUT_EFFORT ? { reasoningEffort: process.env.OMDSH_SCOUT_EFFORT } : {}) } : undefined"
              - id: oh-my-worker
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: worker
                  backgroundMode: continuable
                  maxDepth: 2
                  persona: >-
                    You are Worker. Implement the delegated scope completely, keep changes minimal,
                    run relevant checks, and report files changed plus verification results.
                  agentOptions: !!js "process.env.OMDSH_WORKER_PROVIDER && process.env.OMDSH_WORKER_MODEL ? { provider: process.env.OMDSH_WORKER_PROVIDER, model: process.env.OMDSH_WORKER_MODEL, ...(process.env.OMDSH_WORKER_EFFORT ? { reasoningEffort: process.env.OMDSH_WORKER_EFFORT } : {}) } : undefined"
              - id: oh-my-reviewer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: reviewer
                  backgroundMode: continuable
                  maxDepth: 2
                  persona: >-
                    You are Reviewer. Assume the implementation may be wrong. Inspect correctness,
                    security, regressions, edge cases, tests, and maintainability. Do not change files
                    unless the parent explicitly delegates a repair.
                  agentOptions: !!js "process.env.OMDSH_REVIEWER_PROVIDER && process.env.OMDSH_REVIEWER_MODEL ? { provider: process.env.OMDSH_REVIEWER_PROVIDER, model: process.env.OMDSH_REVIEWER_MODEL, ...(process.env.OMDSH_REVIEWER_EFFORT ? { reasoningEffort: process.env.OMDSH_REVIEWER_EFFORT } : {}) } : undefined"
              - id: oh-my-architect
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: architect
                  backgroundMode: continuable
                  maxDepth: 2
                  persona: >-
                    You are Architect. Focus on system boundaries, data flow, API contracts,
                    failure modes, performance, and migration cost. Prefer the smallest design
                    that remains extensible. Do not edit files.
                  agentOptions: !!js "process.env.OMDSH_ARCHITECT_PROVIDER && process.env.OMDSH_ARCHITECT_MODEL ? { provider: process.env.OMDSH_ARCHITECT_PROVIDER, model: process.env.OMDSH_ARCHITECT_MODEL, ...(process.env.OMDSH_ARCHITECT_EFFORT ? { reasoningEffort: process.env.OMDSH_ARCHITECT_EFFORT } : {}) } : undefined"
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
